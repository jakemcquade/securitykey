[package]
name = "fido-core"
version = "0.1.0"
edition = "2024"
description = "U2F/CTAPHID core for a security key firmware"

[dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic"] }
zeroize = { version = "1", default-features = false, features = ["derive"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }
heapless = "0.8"

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "std"] }
rand_chacha = "0.3"